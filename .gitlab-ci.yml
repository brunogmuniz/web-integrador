workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always


stages:
  - build
  - deploy

build docker image:
  image: docker:20.10.5
  services:
    - docker:20.10.5-dind
  stage: build
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  script:
    - docker login --username="$CI_REGISTRY_USER" --password="$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$PASSWORD_DOCKER_DHI" | docker login --username "$USER_DOCKER_DHI" --password-stdin dhi.io
    - docker pull "$IMAGE" || true
    - >-
      docker build
      --tag "$IMAGE"
      .
    - docker push "$IMAGE"
  tags:
    - bolicheiro
  only:
    - main
    - production
    
deploy review:
  stage: deploy
  variables:
    SERVICE_REQUESTED: API
    COMMAND: deploy
    BRANCH_NAME: $CI_COMMIT_REF_NAME
    DOCKER_LOGIN: $DOCKER_LOGIN       
    DOCKER_PASSWORD: $DOCKER_PASSWORD
  trigger:
    project: br.ufsm.lumac1/bolicheiro/utils/env-deployer-main
    strategy: depend
  rules:
    - if: $CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "production"
      when: on_success
    - when: never


