workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production"'
      when: always
    - when: never

variables:
  GIT_TEMPLATE_DIR: ""
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx

stages:
   - config
   - build
   - merge

config_treinamento:
  stage: config
  image: nginx:1.25
  variables:
    PRODUCTION: true,

    APIURL: "https://main.api.bolicheiro.ufsm.br",

    ISSUER: 'https://oauth.bolicheiro.ufsm.br/realms/ufsm',

    CLIENTID: 'webClient',
    RESPONSETYPE: 'code',
    SCOPE: 'openid profile email offline_access',


  script:
    - envsubst < src/assets/static-js/env.template.js > src/environments/environment.ts
    - echo "Configuração aplicada com sucesso."
    - cat src/environments/environment.ts
  tags:
    - bolicheiro
  artifacts:
    paths:
      - src/
    expire_in: 1 hour
  only:
    - main

.default_build:
  image:
    name: dhi.io/node:20-debian12-dev
    entrypoint: [""]
  stage: build
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
  before_script:
    - apt-get update && apt-get install -y curl unzip python3
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
  script:
    - rm -f bun.lockb package-lock.json yarn.lock
    - ls -a
    - bun pm cache rm
    - bun install --force
    - node --openssl-legacy-provider ./node_modules/.bin/ng build $MODULE --aot --base-href="$BASE_HREF" --configuration=production
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - dist/
    expire_in: 1h
  tags:
    - bolicheiro

build_admin:
  extends: .default_build
  variables:
    MODULE: modulo-admin
    BASE_HREF: /admin/

build_dept_ensino:
  extends: .default_build
  variables:
    MODULE: modulo-dept-ensino
    BASE_HREF: /dept-ensino/    

assemble_image:
  stage: merge
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
    ENV: "production"
  before_script:
    - docker login --username="$CI_REGISTRY_USER" --password="$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$PASSWORD_DOCKER_DHI" | docker login --username "$USER_DOCKER_DHI" --password-stdin dhi.io
    - docker pull "$IMAGE" || true
  needs:
    - build_admin
    - build_dept_ensino
  script:
    - mkdir -p modulo-admin modulo-dept-ensino
    - cp -r dist/modulo-admin/* modulo-admin/
    - cp -r dist/modulo-dept-ensino/* modulo-dept-ensino/
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  tags:
    - bolicheiro