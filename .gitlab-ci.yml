workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

variables:
  GIT_TEMPLATE_DIR: ""
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx

stages:
   - build

.default_build:
  image:
    name: dhi.io/node:20-debian12-dev
    entrypoint: [""]
  stage: build
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
  before_script:
    - apt-get update && apt-get install -y curl unzip python3
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
  script:
    - rm -f bun.lockb package-lock.json yarn.lock
    - ls -a
    - bun pm cache rm
    - bun install --force
    - node --openssl-legacy-provider ./node_modules/.bin/ng build $MODULE --aot --base-href="$BASE_HREF" --configuration=production
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - dist/
    expire_in: 1h
  tags:
    - bolicheiro

build_admin:
  extends: .default_build
  variables:
    MODULE: modulo-admin
    BASE_HREF: /admin/

build_depto_ensino:
  extends: .default_build
  variables:
    MODULE: modulo-dept-ensino
    BASE_HREF: /depto_ensino/    
