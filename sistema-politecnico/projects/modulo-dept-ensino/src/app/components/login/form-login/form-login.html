<div class="login-page">
  <div class="login-container">
    <h1>Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>


      <div class="form-group">
        <input
          id="usuario"
          type="text"
          formControlName="usuario"
          placeholder="Matrícula"
          required
        />
      </div>

      <div class="form-group password-group">
        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="Senha"
          required
        />
        <span class="toggle-password" (click)="togglePasswordVisibility()"><img src="/shared-assets/icons/togglePassword.svg" alt=""></span>
      </div>


      <button type="submit" [disabled]="loginForm.invalid" class="btn-login">
        Login
      </button>
    </form>


    <div class="login-links">
      <a href="#" class="forgot-password">Esqueceu a senha?</a>
      <br>
      <a href="#" class="govbr-login">
        Entrar com o
        <img src="/shared-assets/images/logos/logo-govbr.png" alt="gov.br" class="govbr-logo" />
      </a>
    </div>
  </div>
</div>
