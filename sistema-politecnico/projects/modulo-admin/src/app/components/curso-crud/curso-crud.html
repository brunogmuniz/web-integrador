
<form [formGroup]="cursoForm" (ngSubmit)="onSubmit()">
  <div class="form-card">

    <div class="form-row">
      <div class="col-8">
        <lib-form-input-padrao
          [label]="'Nome'"
          [control]="c['nome']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>

      <div class="col-4">
        <lib-form-input-padrao
          [label]="'Sigla'"
          [control]="c['sigla']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>
    </div>

    <div class="form-row">
      <lib-form-input-padrao
        [label]="'Ano Curriculo'"
        [control]="c['anoCurriculo']"
        [type]="'number'"
        [supportText]="''">
      </lib-form-input-padrao>
    </div>

    <div class="form-row">
      <lib-form-input-padrao
        [label]="'Carga Horaria'"
        [control]="c['cargaHoraria']"
        [type]="'number'"
        [supportText]="''">
      </lib-form-input-padrao>
    </div>

    <div class="form-row">
      <div class="select-wrapper">
        <select [formControl]="c['nivel']" class="custom-select">
          <option *ngFor="let nivel of niveis" [value]="nivel">{{ nivel }}</option>
        </select>
        <span class="select-arrow"></span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="cursoForm.invalid">Inserir</button>
    </div>

  </div>
</form>


<!-- AQUI COMEÇA O READ -->

<table class="table table-striped">
  <thead>
  <tr>
    <th scope="col">Id</th>
    <th scope="col">Nome</th>
    <th scope="col">Sigla</th>
    <th scope="col">CH</th>
    <th scope="col">Ano</th>
    <th scope="col">Editar</th>
    <th scope="col">Excluir</th>
  </tr>
  </thead>
  <tbody>
    @for (curso of cursos; track curso.id) {
      <tr class="align-middle">
        <th scope="row">{{ curso.id }}</th>
        <td>{{ curso.nome }}</td>
        <td>{{ curso.sigla }}</td>
        <td>{{ curso.anoCurriculo }}</td>
        <td>{{ curso.cargaHorariaTotal }}</td>
        <td>{{ curso.nivel }}</td>
        <td class="text-end">
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-danger" (click)="onDelete(curso.id)">
              Excluir
            </button>
          </div>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="7" class="text-center text-muted">
          Nenhum curso cadastrado.
        </td>
      </tr>
    }
  </tbody>
</table>
