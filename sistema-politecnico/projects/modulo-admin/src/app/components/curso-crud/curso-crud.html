

<form [formGroup]="disciplinaForm" (ngSubmit)="onSubmit()">
  <div class="form-card">

    <div class="form-row">
      <div class="col-8">
        <lib-form-input-padrao
          [label]="'Nome'"
          [control]="c['nome']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>

      <div class="col-4">
        <lib-form-input-padrao
          [label]="'Sigla'"
          [control]="c['sigla']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>
    </div>

    <div class="form-row">
      <lib-form-input-padrao
        [label]="'Ano Curriculo'"
        [control]="c['anoCurriculo']"
        [type]="'number'"
        [supportText]="''">
      </lib-form-input-padrao>
    </div>

    <div class="form-row">
      <lib-form-input-padrao
        [label]="'Carga Horaria'"
        [control]="c['cargaHoraria']"
        [type]="'number'"
        [supportText]="''">
      </lib-form-input-padrao>
    </div>

    <div class="form-row">
      <div class="select-wrapper">
        <select [formControl]="c['nivel']" class="custom-select">
          <option *ngFor="let nivel of niveis" [value]="nivel">{{ nivel }}</option>
        </select>
        <span class="select-arrow"></span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="disciplinaForm.invalid">Inserir</button>
    </div>

  </div>
</form>
