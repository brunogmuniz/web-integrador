
<form [formGroup]="departamentoForm" (ngSubmit)="onSubmit()">
  <div class="form-card">

    <div class="form-row">
      <div class="col-8">
        <lib-form-input-padrao
          [label]="'Nome'"
          [control]="c['nome']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>

      <div class="col-4">
        <lib-form-input-padrao
          [label]="'Sigla'"
          [control]="c['sigla']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="departamentoForm.invalid">Inserir</button>
    </div>

  </div>
</form>


<!-- AQUI COMEÇA O READ -->

<table class="table table-striped">
  <thead>
  <tr>
    <th scope="col">Id</th>
    <th scope="col">Nome</th>
    <th scope="col">Sigla</th>
    <th scope="col">Excluir</th>
  </tr>
  </thead>
  <tbody>
    @for (curso of departamentos; track curso.id) {
      <tr class="align-middle">
        <th scope="row">{{ curso.id }}</th>
        <td>{{ curso.nome }}</td>
        <td>{{ curso.sigla }}</td>
        <td class="text-end">
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-danger" (click)="onDelete(curso.id)">
              Excluir
            </button>
          </div>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="text-center text-muted">
          Nenhum curso cadastrado.
        </td>
      </tr>
    }
  </tbody>
</table>
