<form [formGroup]="disciplinaForm" (ngSubmit)="onSubmit()">
  <div class="form-card">
    <div class="form-row">
      <div class="col-8">
        <lib-form-input-padrao
          [label]="'Nome'"
          [control]="c['nome']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>

      <div class="col-4">
        <lib-form-input-padrao
          [label]="'Codigo da Disciplina'"
          [control]="c['codigoDisciplina']"
          [supportText]="''">
        </lib-form-input-padrao>
      </div>
    </div>

    <div class="form-row">
      <lib-form-input-padrao
        [label]="'Carga Horaria'"
        [control]="c['cargaHoraria']"
        [type]="'number'"
        [supportText]="''">
      </lib-form-input-padrao>
    </div>


    <div class="form-row">
      <div class="select-wrapper">
        <select [formControl]="c['subArea']" class="custom-select">
          <option *ngFor="let subArea of subAreas" [value]="subArea">{{ subArea }}</option>
        </select>
        <span class="select-arrow"></span>
      </div>
    </div>


    <div class="form-actions">
      <button type="submit" [disabled]="disciplinaForm.invalid">Inserir</button>
    </div>

  </div>
</form>


<!-- AQUI EM BAIXO COMEÇA O READ -->

<table class="table table-striped">
  <thead>
  <tr>
    <th scope="col">Id</th>
    <th scope="col">Nome</th>
    <th scope="col">Codigo</th>
    <th scope="col">CH</th>
    <th scope="col">SubArea</th>
    <th scope="col">Excluir</th>
  </tr>
  </thead>
  <tbody>
    @for (disciplina of disciplinas; track disciplina.id) {
      <tr class="align-middle">
        <th scope="row">{{ disciplina.id }}</th>
        <td>{{ disciplina.nome }}</td>
        <td>{{ disciplina.codigoDisciplina }}</td>
        <td>{{ disciplina.cargaHoraria }}</td>
        <td>{{ disciplina.subarea }}</td>
        <td class="text-end">
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-danger" (click)="onDelete(disciplina.id)">
              Excluir
            </button>
          </div>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6" class="text-center text-muted">
          Nenhuma area cadastrado.
        </td>
      </tr>
    }
  </tbody>
</table>
