server {
    listen 8080;
    port_in_redirect off;
    autoindex off;
    add_header Content-Security-Policy "frame-ancestors https://*.bolicheiro.ufsm.br";
    root /usr/share/nginx/html;

   
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location /dept-ensino/ {
        try_files $uri $uri/ /dept-ensino/index.html;
    }

    location /dept-ensino {
        try_files $uri $uri/ /dept-ensino/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}