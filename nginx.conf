server {
    listen 8080;
    port_in_redirect off;
    autoindex off;
    add_header Content-Security-Policy "frame-ancestors https://*.bolicheiro.ufsm.br";
    root /usr/share/nginx/html;

   
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }


    location /geral/ {
        try_files $uri $uri/ /geral/index.html;
    }
    location /geral {
        try_files $uri $uri/ /egeral/index.html;
    }


    location / {
        try_files $uri /index.html $uri/ =404;
    }

}