<div class="sidebar-container bg-navy-custom" [class.sidebar-minimized]="isSidebarMinimized">

  <div class="sidebar-header bg-navy-custom">
    <div class="sidebar-logo">
      <a routerLink="/">
        <img src="assets/img/brasao-ufsm-politecnico.png" alt="Brasão UFSM">
      </a>
    </div>
    <div class="sidebar-toggler-wrapper">
      <button class="toggler-button" aria-label="Alternar tamanho do menu lateral" (click)="toggleSidebarSize()">
        <i class="la la-bars text-white"></i>
      </button>
    </div>
  </div>

  <div class="sidebar-menu-wrapper bg-navy-custom">
    <ul class="menu-nav">

      <li class="menu-section">
        <h4 class="menu-section-text">Principal</h4>
      </li>

      <li class="menu-item" [routerLinkActive]="'menu-item-active'" [routerLinkActiveOptions]="{ exact: true }">
        <a class="menu-link" routerLink="visualizar-projetos">
          <i class="menu-link-icon la la-home"></i>
          <span class="menu-link-text">Página Inicial</span>
        </a>
      </li>

      <li class="menu-section">
        <h4 class="menu-section-text">Projetos</h4>
      </li>

      <li class="menu-item" [routerLinkActive]="'menu-item-active'" [routerLinkActiveOptions]="{ exact: true }">
        <a class="menu-link" routerLink="visualizar-projetos">
          <i class="menu-link-icon la la-eye"></i>
          <span class="menu-link-text">Ver Todos</span>
        </a>
      </li>

      <li class="menu-item" [routerLinkActive]="'menu-item-active'" [routerLinkActiveOptions]="{ exact: true }">
        <a class="menu-link" routerLink="projetos-recomendados">
          <i class="menu-link-icon la la-star"></i>
          <span class="menu-link-text">Projetos Recomendados</span>
        </a>
      </li>

      <li class="menu-section">
        <h4 class="menu-section-text">Gerenciamento</h4>
      </li>

      <li class="menu-item" [routerLinkActive]="'menu-item-active'" [routerLinkActiveOptions]="{ exact: true }">
        <a class="menu-link" routerLink="gerenciar-interesses">
          <i class="menu-link-icon la la-sliders"></i>
          <span class="menu-link-text">Gerenciar Interesses</span>
        </a>
      </li>

    </ul>

    <div class="sidebar-footer" (click)="sair()">
      <i class="la la-sign-out"></i>
      <span class="menu-link-text">Sair</span>
    </div>
  </div>
</div>
