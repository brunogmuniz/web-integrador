<div class="selecao-modulo">
  <div class="selecao-card" *ngIf="!carregando">
    <div class="campo">
      <lib-select-input-default
        label="Módulo"
        [(ngModel)]="moduloSelecionado"
        [opcoes]="opcoesModulos"
        [clearable]="false"
        [searchable]="false"
        groupClass="form-group mb-0">
      </lib-select-input-default>
    </div>

    <div class="acoes">
      <button class="btn btn-primary" type="button" (click)="continuar()">
        Continuar
      </button>
    </div>
  </div>
</div>
