<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
         <span class="kt-portlet__head-icon">
            <i class="flaticon2-architecture-and-city text-primary"></i>
         </span>
      <h3 class="kt-portlet__head-title">
        Página Inicial
      </h3>
    </div>
  </div>
  <div class="kt-portlet__body">


  <div class="row">
  <ng-container *ngIf="modulos.length > 0;">
    <div *ngFor="let m of modulos" class="cardModulo" (click)="navegar(m.pageGo)">
      <div class="mainModulo">
        <div class="iconeModulo">
          <span *ngIf="m.svgIcon != null" class="kt-widget17__icon" [innerHTML]="m.svgIcon" ></span>
        </div>
        <div class="textosModulo">
          <div class="tituloModulo" >{{m.title}}</div>
          <div class="infoModulo">{{m.info}}</div>
        </div>
      </div>
      <div class="iconeArrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="16" viewBox="0 0 17 16" fill="none">

</div>
