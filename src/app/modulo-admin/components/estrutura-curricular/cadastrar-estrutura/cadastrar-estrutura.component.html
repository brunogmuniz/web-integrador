<div class="card card-custom">
  <div class="card-header">
    <h3 class="card-title">
      {{ form.value.id ? 'Editar Estrutura Curricular' : 'Nova Estrutura Curricular' }}
    </h3>
  </div>

  <form [formGroup]="form" (ngSubmit)="salvar()" class="form">
    <div class="card-body">

      <div class="row">
        <div class="col-md-6">
          <lib-form-input-padrao
            label="Código *"
            [control]="c.codigo"
            supportText="">
          </lib-form-input-padrao>
        </div>
        <div class="col-md-6">
          <lib-form-input-padrao
            label="Ano *"
            [control]="c.ano"
            supportText="">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label class="form-label">Curso *</label>
          <select [formControl]="c.idCurso" class="form-select">
            <option [ngValue]="null" disabled>Selecione...</option>
            <option *ngFor="let curso of listaCursos" [value]="curso.id">
              {{ curso.nome }}
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Ativo</label>
          <select [formControl]="c.ativo" class="form-select">
            <option [ngValue]="true">Sim</option>
            <option [ngValue]="false">Não</option>
          </select>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12">
          <h5>Ofertas de Disciplinas</h5>
          <button type="button" class="btn btn-sm btn-primary mb-2" (click)="adicionarOferta()">
            Adicionar Oferta
          </button>

          <div formArrayName="ofertas">
            <div *ngFor="let oferta of ofertas.controls; let i=index" [formGroupName]="i" class="card card-body mb-2">
              <div class="row">
                <div class="col-md-6">
                  <label>Disciplina *</label>
                  <select formControlName="idDisciplina" class="form-select">
                    <option [ngValue]="null" disabled>Selecione...</option>
                    <option *ngFor="let disc of listaDisciplinas" [value]="disc.id">{{ disc.nome }}</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label>Períodos</label>
                  <div class="d-flex gap-2 flex-wrap">
                    <span *ngFor="let p of oferta.get('periodos')?.value" class="badge bg-info">
                      {{ p }}
                      <i class="fa fa-times ms-1" style="cursor:pointer" (click)="removerPeriodoDeOferta(i, p)"></i>
                    </span>
                  </div>
                  <button type="button" class="btn btn-sm btn-outline-primary mt-1" (click)="abrirModalPeriodo(i)">
                    Adicionar Período
                  </button>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                  <button type="button" class="btn btn-sm btn-danger" (click)="removerOferta(i)">
                    Remover
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>

    <div class="card-footer d-flex justify-content-end">
      <button type="button" class="btn btn-secondary me-2" (click)="fecharModalPeriodo()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        <i class="fa fa-check"></i> Salvar
      </button>
    </div>
  </form>
</div>
