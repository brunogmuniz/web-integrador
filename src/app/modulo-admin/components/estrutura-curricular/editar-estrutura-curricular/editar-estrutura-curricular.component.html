<div class="card card-custom">
  <div class="card-header">
    <h3 class="card-title">Edição de Estrutura Curricular</h3>
  </div>

  <div class="card-body">
    <form [formGroup]="form">
      <div class="mb-5">
        <div class="row g-4">
          <div class="col-lg-6">
            <label class="form-label text-gray-700 fw-semibold required">Nome do Currículo</label>
            <input
              type="text"
              class="form-control form-control-solid"
              placeholder="Ex: Engenharia de Software 2025/1"
              formControlName="codigo"
              [class.is-invalid]="form.get('codigo')?.invalid && form.get('codigo')?.touched"
            />
            <div *ngIf="form.get('codigo')?.invalid && form.get('codigo')?.touched" class="invalid-feedback d-block">
              O nome é obrigatório
            </div>
          </div>

          <div class="col-lg-2">
            <label class="form-label text-gray-700 fw-semibold required">Ano</label>
            <input
              type="number"
              class="form-control form-control-solid"
              placeholder="Ex: 2025"
              formControlName="ano"
              [class.is-invalid]="form.get('ano')?.invalid && form.get('ano')?.touched"
            />
            <div *ngIf="form.get('ano')?.invalid && form.get('ano')?.touched" class="invalid-feedback d-block">
              Ano inválido
            </div>
          </div>

          <div class="col-lg-4">
            <label class="form-label text-gray-700 fw-semibold required">Curso</label>
            <select
              class="form-select form-select-solid"
              formControlName="idCurso"
              [class.is-invalid]="form.get('idCurso')?.invalid && form.get('idCurso')?.touched"
            >
              <option [ngValue]="null" disabled>Selecione o Curso...</option>
              <option *ngFor="let curso of listaCursos; trackBy: trackByCursoId" [value]="curso.id">
                {{ curso.nome }}
              </option>
            </select>
            <div *ngIf="form.get('idCurso')?.invalid && form.get('idCurso')?.touched" class="invalid-feedback d-block">
              Selecione um curso
            </div>
          </div>
        </div>
      </div>
    </form>

    <div class="separator separator-dashed my-6"></div>
    <div class="d-flex flex-stack mb-5">
      <h3 class="text-gray-800 fw-bold m-0">
        <i class="la la-book text-primary fs-2 me-2"></i>
        Oferta de Disciplinas
      </h3>
      <button type="button" class="btn btn-sm btn-light-primary" (click)="adicionarOferta()">
        <i class="la la-plus"></i> Adicionar Disciplina
      </button>
    </div>

    <form [formGroup]="form">
      <div class="table-responsive" formArrayName="ofertas">
        <table class="table table-row-bordered table-row-gray-300 align-middle gs-3 gy-4" *ngIf="ofertas.controls.length > 0; else nenhumaOferta">
          <thead>
          <tr class="fw-bold fs-6 text-gray-800 border-bottom-2 border-gray-200">
            <th class="min-w-300px required">Disciplina</th>
            <th class="min-w-100px required">Semestre</th>
            <th class="min-w-100px text-center">Nº Prof. Teórica</th>
            <th class="min-w-100px text-center">Nº Prof. Prática</th>
            <th class="min-w-80px text-center">Tutoria</th>
            <th class="min-w-50px text-center">Ações</th>
          </tr>
          </thead>
          <tbody class="fs-6">
          <tr *ngFor="let oferta of ofertas.controls; let i = index" [formGroupName]="i">
            <td>
              <select
                class="form-select form-select-solid"
                formControlName="idDisciplina"
                [class.is-invalid]="oferta.get('idDisciplina')?.invalid && oferta.get('idDisciplina')?.touched">
                <option [ngValue]="null">Selecione...</option>
                <option *ngFor="let disc of listaDisciplinas; trackBy: trackByDisciplinaId" [value]="disc.id">
                  {{ disc.codigoDisciplina }} - {{ disc.nome }}
                </option>
              </select>
            </td>

            <td>
              <select
                class="form-select form-select-solid"
                formControlName="semestre"
                [class.is-invalid]="oferta.get('semestre')?.invalid && oferta.get('semestre')?.touched">
                <option [ngValue]="null">...</option>
                <option *ngFor="let sem of listaOpcoesSemestre" [value]="sem">{{ sem }}º Semestre</option>
              </select>
            </td>

            <td>
              <input type="number"
                     class="form-control form-control-solid text-center"
                     formControlName="numProfessoresTeorica"
                     min="1" />
            </td>

            <td>
              <input type="number"
                     class="form-control form-control-solid text-center"
                     formControlName="numProfessoresPratica"
                     min="1" />
            </td>

            <td class="text-center">
              <div class="form-check form-check-custom form-check-solid form-check-sm d-inline-block">
                <input class="form-check-input" type="checkbox" formControlName="tutoria" />
              </div>
            </td>

            <td class="text-center">
              <button type="button"
                      class="btn btn-icon btn-light-danger btn-sm"
                      (click)="removerOferta(i)"
                      title="Remover">
                <i class="la la-trash fs-3"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>

        <ng-template #nenhumaOferta>
          <div class="alert alert-dismissible bg-light-warning border border-warning border-dashed d-flex flex-column flex-sm-row w-100 p-5 mb-10">
            <div class="d-flex flex-column pe-0 pe-sm-10">
              <h5 class="mb-1 text-warning">Nenhuma disciplina adicionada</h5>
              <span class="text-gray-600">Clique em "Adicionar Disciplina" para compor a estrutura curricular.</span>
            </div>
          </div>
        </ng-template>
      </div>
    </form>
  </div>

  <div class="card-footer d-flex justify-content-between">
    <button type="button" class="btn btn-light-secondary" (click)="cancelar()">
      <i class="la la-times"></i> Cancelar
    </button>

    <button type="button" class="btn btn-primary" (click)="salvar()" [disabled]="form.invalid">
      <i class="la la-check"></i> Atualizar Estrutura
    </button>
  </div>
</div>
