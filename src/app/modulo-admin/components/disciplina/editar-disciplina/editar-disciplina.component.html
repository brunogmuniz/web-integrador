<div class="card card-custom">
  <div class="card-header">
    <h3 class="card-title">Editar Disciplina</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label required">Nome</label>
          <input type="text" class="form-control form-control-solid" formControlName="nome"
                 [class.is-invalid]="form.get('nome')?.invalid && (form.get('nome')?.touched || form.get('nome')?.dirty)"/>
          <div class="invalid-feedback">Campo obrigatório (min. 3 caracteres)</div>
        </div>

        <div class="col-md-3">
          <label class="form-label required">Código</label>
          <input type="text" class="form-control form-control-solid" formControlName="codigoDisciplina"
                 [class.is-invalid]="form.get('codigoDisciplina')?.invalid && (form.get('codigoDisciplina')?.touched || form.get('codigoDisciplina')?.dirty)"/>
          <div class="invalid-feedback">Campo obrigatório</div>
        </div>

        <div class="col-md-3">
          <label class="form-label required">Subárea</label>
          <select class="form-select form-select-solid" formControlName="subarea" [compareWith]="compararSubareas"
                  [class.is-invalid]="form.get('subarea')?.invalid && (form.get('subarea')?.touched || form.get('subarea')?.dirty)">
            <option [ngValue]="null">Selecione...</option>
            <option *ngFor="let s of subareas" [ngValue]="s">{{ s.nome }}</option>
          </select>
          <div class="invalid-feedback">Campo obrigatório</div>
        </div>

        <div class="col-md-2">
          <label class="form-label required">CH Teórica</label>
          <input type="number" class="form-control form-control-solid" formControlName="cargaHorariaTeorica" min="0"/>
        </div>

        <div class="col-md-2">
          <label class="form-label required">CH Prática</label>
          <input type="number" class="form-control form-control-solid" formControlName="cargaHorariaPratica" min="0"/>
        </div>


        <div class="col-md-2 d-flex align-items-center mt-8">
          <div class="form-check form-check-custom form-check-solid">
            <input class="form-check-input" type="checkbox" formControlName="ead" id="chkEadEdit"/>
            <label class="form-check-label fw-bold cursor-pointer" for="chkEadEdit">
              EAD
            </label>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="card-footer d-flex justify-content-between">
    <button type="button" class="btn btn-light-secondary" (click)="cancelar()">
      <i class="la la-times"></i> Cancelar
    </button>
    <button type="button" class="btn btn-primary" (click)="salvar()" [disabled]="form.invalid">
      <i class="la la-save"></i> Salvar Alterações
    </button>
  </div>
</div>
