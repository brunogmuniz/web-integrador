<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-row-bordered table-row-gray-300 align-middle gs-3 gy-4">
        <thead>
        <tr class="fw-bold fs-6 text-gray-800 border-bottom-2 border-gray-200">
          <th class="min-w-200px">#</th>
          <th class="min-w-150px">Sigla</th>
          <th class="min-w-200px">Nome</th>
          <th class="min-w-100px text-center">CHT</th>
          <th class="min-w-200px">Area</th>
          <th class="min-w-120px text-center">Ações</th>
        </tr>
        </thead>
        <tbody class="fs-6">
        <tr *ngFor="let sub of subAreas; trackBy: trackBySubId">
          <td>
            <div class="d-flex flex-column">
              <span class="text-gray-800 fw-bold">{{ sub.id }}</span>
            </div>
          </td>
          <td>
            <span class="text-gray-700">{{ sub.sigla }}</span>
          </td>
          <td>
            <span class="text-gray-700">{{ sub.nome }}</span>
          </td>
          <td>
            <span class="text-gray-700">{{ sub.cargaHorariaTotal }}</span>
          </td>
          <td>
            <span class="text-gray-700">{{ sub.area }}</span>
          </td>

          <td class="text-center">
            <a [routerLink]="['../editar', sub.id]"
               class="btn btn-icon btn-light-primary btn-sm"
               title="Editar Encargos">
              <i class="la la-edit fs-3"></i>
            </a>
          </td>
        </tr>
        <ng-template #emptyList>
          <tr>
            <td colspan="5" class="text-center py-10">
              <div class="d-flex flex-column align-items-center">
                <i class="la la-info-circle fs-3x text-gray-400 mb-3"></i>
                <span class="text-gray-600 fw-semibold fs-5">
                    Nenhum registro encontrado.
                  </span>
              </div>
            </td>
          </tr>
        </ng-template>
        </tbody>
      </table>
    </div>
  </div>
</div>
