<div class="card mt-3">
  <div class="card-header bg-navy-custom text-black">
    <h5 class="mb-0">
      {{ modoEdicao ? 'Editar Subárea de Conhecimento' : 'Cadastrar Subárea de Conhecimento' }}
    </h5>
  </div>
  <div class="card-body">
    <form [formGroup]="subAreaForm" (ngSubmit)="onSubmit()">

      <div class="form-row mb-3">
        <div class="col-md-8">
          <lib-form-input-padrao
            [label]="'Nome'"
            [control]="c['nome']"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-4">
          <lib-form-input-padrao
            [label]="'Sigla'"
            [control]="c['sigla']"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="form-row mb-3">
        <div class="col-md-4">
          <lib-form-input-padrao
            [label]="'Carga Horária'"
            [control]="c['cargaHoraria']"
            [type]="'number'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="form-row mb-3">
        <div class="col-md-6">
          <label for="areaConhecimento" class="form-label">Área de Conhecimento</label>
          <select id="areaConhecimento" class="form-select" formControlName="areaConhecimentoId">
            <option [ngValue]="null" disabled>Selecione uma área...</option>
            <option *ngFor="let area of areasDeConhecimento$ | async" [value]="area.id">
              {{ area.nome }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-actions text-right">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="subAreaForm.invalid">
          {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
        </button>
      </div>

    </form>
  </div>
</div>
