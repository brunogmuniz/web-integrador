<div class="card mt-3">
  <div class="card-header bg-navy-custom text-white">
    <h5 class="mb-0 kt-label-font-color-4">
      {{ modoEdicao ? 'Editar Curso' : 'Cadastrar Curso' }}
    </h5>
  </div>
  <div class="card-body">
    <form [formGroup]="cursoForm" (ngSubmit)="onSubmit()" *ngIf="cursoForm">

      <div class="form-row mb-3">
        <div class="col-md-6">
          <lib-form-input-padrao
            [label]="'Nome'"
            [control]="controlesFormulario['nome']"
            [placeholder]="'Digite o nome'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-3">
          <lib-form-input-padrao
            [label]="'Sigla'"
            [control]="controlesFormulario['sigla']"
            [placeholder]="'Digite a sigla'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-3">
          <lib-form-input-padrao
            [label]="'Código'"
            [control]="controlesFormulario['codigo']"
            [placeholder]="'Digite o código'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="form-row mb-3">
        <div class="col-md-4">
          <lib-form-input-padrao
            [label]="'Ano Currículo'"
            [control]="controlesFormulario['anoCurriculo']"
            [type]="'number'"
            [placeholder]="'Digite o ano'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-4">
          <lib-form-input-padrao
            [label]="'Carga Horária Total'"
            [control]="controlesFormulario['cargaHorariaTotal']"
            [type]="'number'"
            [placeholder]="'Digite a carga horária total'"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-4">
          <lib-select-input-default
            label="Nível"
            formControlName="nivel"
            placeholder="Selecione..."
            [required]="true"
            [clearable]="false"
            [opcoes]="opcoesNiveis">
          </lib-select-input-default>
        </div>
      </div>

      <div class="form-actions text-right">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">
          <i class="la la-times"></i>
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="cursoForm.invalid">
          <i class="la la-check"></i>
          {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
        </button>
      </div>

    </form>
  </div>
</div>
