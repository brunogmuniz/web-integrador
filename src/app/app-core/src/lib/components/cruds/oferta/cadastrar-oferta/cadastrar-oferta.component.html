<div class="card card-custom">
  <div class="card-header">
    <h3 class="card-title">{{ modoEdicao ? 'Editar Oferta' : 'Nova Oferta' }}</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form">
      <div class="row g-4">
        <div class="col-md-4">
          <label class="form-label required">Ano</label>
          <input type="text" class="form-control form-control-solid" formControlName="ano" placeholder="2026" />
        </div>
        <div class="col-md-4">
          <lib-select-input-default
            label="Semestre"
            formControlName="semestre"
            placeholder="Selecione..."
            [required]="true"
            [clearable]="false"
            [searchable]="false"
            [opcoes]="opcoesSemestres">
          </lib-select-input-default>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check form-check-custom form-check-solid">
            <input id="ativo" class="form-check-input" type="checkbox" formControlName="ativo" />
            <label class="form-check-label fw-semibold" for="ativo">Disponível</label>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="card-footer d-flex justify-content-between">
    <button type="button" class="btn btn-light-secondary" (click)="cancelar()">
      <i class="la la-times"></i> Cancelar
    </button>
    <button type="button" class="btn btn-primary" [disabled]="form.invalid || loading" (click)="salvar()">
      <i class="la la-check"></i> Salvar
    </button>
  </div>
</div>
