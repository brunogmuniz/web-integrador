<div class="mt-4 w-100" *ngIf="listaEstruturas.length > 14">
  <app-paginador
    [meta]="meta"
    (mudancaPagina)="aoMudarPaginacao($event)">
  </app-paginador>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-row-bordered table-row-gray-300 align-middle gs-3 gy-4">
        <thead>
        <tr class="fw-bold fs-6 text-gray-800 border-bottom-2 border-gray-200">
          <th class="min-w-50px">#</th>
          <th class="min-w-200px">Nome do Currículo</th>
          <th class="min-w-100px">Curso</th>
          <th class="min-w-100px">Ano</th>
          <th class="min-w-80px text-center">Ativo</th>
          <th class="min-w-120px text-center">Ações</th>
        </tr>
        </thead>
        <tbody class="fs-6">
        <ng-container *ngIf="(listaEstruturas ?? []).length > 0; else emptyList">
          <tr *ngFor="let item of listaEstruturas; trackBy: trackByEstruturaUuid; let i = index">
            <td>
              <span class="text-gray-800 fw-bold">{{ (meta.paginaAtual * meta.tamanho) + i + 1 }}</span>
            </td>
            <td><span class="text-gray-800 fw-bold">{{ item.codigo }}</span></td>
            <td><span class="text-gray-700">{{ item.nomeCurso }}</span></td>
            <td><span class="text-gray-700">{{ item.ano }}</span></td>
            <td class="text-center">
              <span class="badge" [ngClass]="item.ativo ? 'badge-success' : 'badge-danger'">
                {{ item.ativo ? 'Sim' : 'Não' }}
              </span>
            </td>
            <td class="text-center">
              <div class="d-flex justify-content-center gap-2">
                <a [routerLink]="['/estrutura-curricular/form/editar', item.uuid]"
                   class="btn btn-icon btn-light-primary btn-sm"
                   title="Editar">
                  <i class="la la-edit fs-3"></i>
                </a>
                <button type="button"
                        class="btn btn-icon btn-light-danger btn-sm" style="color: #d63e3e"
                        (click)="onDelete(item.uuid!, item.codigo)"
                        title="Excluir">
                  <i class="la la-trash fs-3"></i>
                </button>
              </div>
            </td>
          </tr>
        </ng-container>


        <ng-template #emptyList>
          <tr>
            <td colspan="6" class="text-center py-10">
              <div class="d-flex flex-column align-items-center">
                <i class="la la-info-circle fs-3x text-gray-400 mb-3"></i>
                <span class="text-gray-600 fw-semibold fs-5">
                    Nenhuma estrutura curricular encontrada.
                  </span>
              </div>
            </td>
          </tr>
        </ng-template>

        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="mt-4 w-100" *ngIf="listaEstruturas.length > 0">
  <app-paginador
    [meta]="meta"
    (mudancaPagina)="aoMudarPaginacao($event)">
  </app-paginador>
</div>
