<div class="card mt-3">
  <div class="card-header border-0 pt-6">
  </div>

  <div class="card-body pt-0">
    <div class="table-responsive">
      <table class="table table-row-bordered table-row-gray-300 align-middle gs-3 gy-4">
        <thead>
        <tr class="fw-bold fs-6 text-gray-800 border-bottom-2 border-gray-200">
          <th class="min-w-70px">#</th>
          <th class="min-w-200px">Nome</th>
          <th class="min-w-100px text-black">Sigla</th>
          <th class="min-w-150px">Carga Horária</th>
          <th class="min-w-100px text-center">Ações</th>
        </tr>
        </thead>
        <tbody class="fs-6">
        <tr *ngFor="let area of areas; let i = index">
          <td>
            <span class="text-gray-800 fw-bold">{{ i + 1 }}</span>
          </td>
          <td>
            <span class="text-gray-800 fw-bold">{{ area.nome }}</span>
          </td>
          <td>
            <span class="text-gray-800">{{ area.sigla }}</span>
          </td>
          <td>
            <span class="text-gray-700 fw-semibold">{{ area.cargaHorariaTotal }}h</span>
          </td>
          <td class="text-center">
            <button
              class="btn btn-icon btn-light-primary btn-sm me-2" style="color: #303030"
              [routerLink]="['/area/form/editar', area.uuid]"
              title="Editar Área">
              <i class="la la-edit fs-3"></i>
            </button>

            <button
              class="btn btn-icon btn-light-danger btn-sm" style="color: #d63e3e"
              (click)="onDelete(area.uuid)"
              title="Excluir Área">
              <i class="la la-trash fs-3"></i>
            </button>
          </td>
        </tr>

        <ng-template>
          <tr>
            <td colspan="5" class="text-center py-10">
              <div class="d-flex flex-column align-items-center">
                <i class="la la-info-circle fs-3x text-gray-400 mb-3"></i>
                <span class="text-gray-600 fw-semibold fs-5">
                    Nenhuma área cadastrada.
                  </span>
              </div>
            </td>
          </tr>
        </ng-template>
        </tbody>
      </table>
    </div>
  </div>
</div>
