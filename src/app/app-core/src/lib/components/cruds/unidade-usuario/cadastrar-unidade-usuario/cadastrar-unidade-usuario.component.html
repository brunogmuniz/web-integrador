<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        Vincular Usuário à Unidade
      </h3>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="kt-form kt-form--label-right">
    <div class="kt-portlet__body">

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-group row form-row-pdsa">
        <div class="col-lg-6">
          <lib-select-input-default
            label="Unidade"
            formControlName="unidadeUuid"
            placeholder="Selecione uma unidade..."
            [required]="true"
            [opcoes]="opcoesUnidades"
            groupClass="mb-0">
          </lib-select-input-default>
          <span class="form-text text-danger"
                *ngIf="form.get('unidadeUuid')?.touched && form.get('unidadeUuid')?.invalid">
            A unidade é obrigatória.
          </span>
        </div>

        <div class="col-lg-6">
          <lib-select-input-default
            label="Usuário"
            formControlName="usuarioId"
            placeholder="Selecione um usuário..."
            [required]="true"
            [opcoes]="opcoesUsuarios"
            groupClass="mb-0">
          </lib-select-input-default>
          <span class="form-text text-danger"
                *ngIf="form.get('usuarioId')?.touched && form.get('usuarioId')?.invalid">
            O usuário é obrigatório.
          </span>
        </div>
      </div>

      <div class="form-group row form-row-pdsa">
        <div class="col-lg-6">
          <lib-select-input-default
            label="Papel na Unidade"
            formControlName="papel"
            placeholder="Selecione o papel..."
            [required]="true"
            [opcoes]="opcoesPapeis"
            groupClass="mb-0">
          </lib-select-input-default>
          <span class="form-text text-danger"
                *ngIf="form.get('papel')?.touched && form.get('papel')?.invalid">
            O papel é obrigatório.
          </span>
        </div>
      </div>

    </div>

    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-12 text-right form-actions-pdsa">
            <button type="button" class="btn btn-secondary mr-2" routerLink="/unidades-usuarios/visualizar">
              <i class="la la-times"></i> Cancelar
            </button>

            <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
              <i class="la la-save" *ngIf="!isLoading"></i>
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1"></span>
              {{ isLoading ? 'Salvando...' : 'Salvar Vínculo' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
