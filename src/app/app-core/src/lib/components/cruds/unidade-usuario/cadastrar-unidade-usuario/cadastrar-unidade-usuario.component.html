<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        Vincular Usuário à Unidade
      </h3>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="kt-form kt-form--label-right">
    <div class="kt-portlet__body">

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-group row form-row-pdsa">
        <!-- UNIDADE -->
        <div class="col-lg-6">
          <label class="pdsa-label">Unidade <span class="text-danger">*</span></label>
          <select class="form-control pdsa-control" formControlName="unidadeUuid">
            <option value="" disabled>Selecione uma unidade...</option>
            <option *ngFor="let unidade of unidades" [value]="unidade.uuid">
              {{ unidade.nome }}
            </option>
          </select>
          <span class="form-text text-danger"
                *ngIf="form.get('unidadeId')?.touched && form.get('unidadeId')?.invalid">
            A unidade é obrigatória.
          </span>
        </div>

        <!-- USUARIO -->
        <div class="col-lg-6">
          <label class="pdsa-label">Usuário <span class="text-danger">*</span></label>
          <select class="form-control pdsa-control" formControlName="usuarioId">
            <option [ngValue]="null" disabled>Selecione um usuário...</option>
            <option *ngFor="let usuario of usuarios" [ngValue]="usuario.id">
              {{ usuario.nome }}
            </option>
          </select>
          <span class="form-text text-danger"
                *ngIf="form.get('usuarioId')?.touched && form.get('usuarioId')?.invalid">
            O usuário é obrigatório.
          </span>
        </div>
      </div>

      <div class="form-group row form-row-pdsa">
        <!-- PAPEL -->
        <div class="col-lg-6">
          <label class="pdsa-label">Papel na Unidade <span class="text-danger">*</span></label>
          <select class="form-control pdsa-control" formControlName="papel">
            <option [ngValue]="null" disabled>Selecione o papel...</option>
            <option *ngFor="let papel of papeis" [value]="papel">
              {{ papel }}
            </option>
          </select>
          <span class="form-text text-danger"
                *ngIf="form.get('papel')?.touched && form.get('papel')?.invalid">
            O papel é obrigatório.
          </span>
        </div>

        <!-- ATIVO -->
        <div class="col-lg-6 d-flex align-items-center" style="padding-top: 1.8rem;">
          <div class="form-check">
            <input formControlName="ativo" class="form-check-input" type="checkbox" id="ativoCheck">
            <label class="form-check-label pdsa-label mb-0" for="ativoCheck">
              Vínculo Ativo
            </label>
          </div>
        </div>
      </div>

    </div>

    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-12 text-right form-actions-pdsa">
            <button type="button" class="btn btn-secondary mr-2" routerLink="/unidades-usuarios/visualizar">
              <i class="la la-times"></i> Cancelar
            </button>

            <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
              <i class="la la-save" *ngIf="!isLoading"></i>
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1"></span>
              {{ isLoading ? 'Salvando...' : 'Salvar Vínculo' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
