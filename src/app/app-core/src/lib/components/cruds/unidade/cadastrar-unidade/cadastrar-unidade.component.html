<div class="kt-portlet cadastro-unidade-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        {{ uuidEdicao ? 'Editar Unidade' : 'Cadastrar Nova Unidade' }}
      </h3>
    </div>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="salvar()" class="kt-form kt-form--label-right">
    <div class="kt-portlet__body">

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-group row form-row-pdsa">
        <div class="col-lg-8">
          <label class="pdsa-label">Nome da Unidade <span class="text-danger">*</span></label>
          <input type="text" class="form-control pdsa-control" formControlName="nome" placeholder="Ex: Departamento de Computação">
          <span class="form-text text-danger" *ngIf="formulario.get('nome')?.touched && formulario.get('nome')?.errors?.['required']">O nome é obrigatório.</span>
        </div>
        <div class="col-lg-4">
          <label class="pdsa-label">Sigla</label>
          <input type="text" class="form-control pdsa-control" formControlName="sigla" placeholder="Ex: DC">
        </div>
      </div>

      <div class="form-group row form-row-pdsa">
        <div class="col-lg-6">
          <lib-select-input-default
            label="Tipo"
            formControlName="tipo"
            placeholder="Selecione um tipo..."
            [required]="true"
            [opcoes]="opcoesTiposDeUnidade"
            groupClass="mb-0">
          </lib-select-input-default>
          <span class="form-text text-danger" *ngIf="formulario.get('tipo')?.touched && formulario.get('tipo')?.errors?.['required']">O tipo é obrigatório.</span>
        </div>
        <div class="col-lg-6">
          <lib-select-input-default
            label="Unidade Gerenciadora (Pai)"
            formControlName="unidadeGerenciadoraUuid"
            placeholder="Nenhuma (Unidade Raiz)"
            [opcoes]="opcoesUnidadesPai"
            groupClass="mb-0">
          </lib-select-input-default>
        </div>
      </div>

    </div>
    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-12 text-right form-actions-pdsa">
            <button type="button" class="btn btn-secondary mr-2" (click)="cancelar()" [disabled]="isSubmetendo">
              <i class="la la-times"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="formulario.invalid || isSubmetendo">
              <i class="la la-save"></i> {{ isSubmetendo ? 'Salvando...' : 'Salvar' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
