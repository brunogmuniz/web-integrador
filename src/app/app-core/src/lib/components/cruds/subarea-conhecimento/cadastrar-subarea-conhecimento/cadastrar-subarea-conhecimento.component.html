<div class="card mt-3">
  <div class="card-header bg-navy-custom text-white">
    <h5 class="mb-0 text-white">
      {{ modoEdicao ? 'Editar Subárea de Conhecimento' : 'Cadastrar Subárea de Conhecimento' }}
    </h5>
  </div>
  <div class="card-body">
    <form [formGroup]="subAreaForm" (ngSubmit)="onSubmit()" *ngIf="subAreaForm">

      <div class="row mb-3">
        <div class="col-md-8">
          <lib-form-input-padrao
            [label]="'nome'"
            [control]="c['nome']"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-4">
          <lib-form-input-padrao
            [label]="'sigla'"
            [control]="c['sigla']"
            [supportText]="''">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Área de Conhecimento</label>
          <select class="form-select" formControlName="areaId">
            <option [ngValue]="null" disabled>Selecione uma área...</option>
            <option *ngFor="let area of areasDeConhecimento$ | async" [ngValue]="area.id">
              {{ area.nome }} ({{ area.sigla }})
            </option>
          </select>
          <div *ngIf="c['areaId'].touched && c['areaId'].invalid" class="text-danger small mt-1">
            A área é obrigatória.
          </div>
        </div>

        <div class="col-md-6">
          <lib-form-input-padrao
            [label]="'Carga Horária Total'"
            [control]="c['cargaHorariaTotal']"
            [supportText]="''"
            [type]="'number'">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="form-actions d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">
          <i class="la la-times"></i>
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="subAreaForm.invalid">
          <i class="la la-check"></i>
          {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
