<div class="card mt-3">
  <div class="card-header bg-navy-custom">
    <h5 class="mb-0">
      {{ modoEdicao ? 'Editar Subárea de Conhecimento' : 'Cadastrar Subárea de Conhecimento' }}
    </h5>
  </div>
  <div class="card-body">
    <form [formGroup]="subAreaForm" (ngSubmit)="onSubmit()" *ngIf="subAreaForm">

      <div class="row mb-3">
        <div class="col-md-8">
          <lib-form-input-padrao
            label="Nome"
            [control]="c['nome']"
            placeholder="Digite o nome"
            supportText="">
          </lib-form-input-padrao>
        </div>

        <div class="col-md-4">
          <lib-form-input-padrao
            label="Sigla"
            [control]="c['sigla']"
            placeholder="Digite a sigla"
            supportText="">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <lib-select-input-default
            label="Área de Conhecimento"
            formControlName="areaId"
            placeholder="Selecione uma área..."
            [required]="true"
            [opcoes]="opcoesAreas">
          </lib-select-input-default>
        </div>
      </div>

      <div class="form-actions d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">
          <i class="la la-times"></i>
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="subAreaForm.invalid">
          <i class="la la-check"></i>
          {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
