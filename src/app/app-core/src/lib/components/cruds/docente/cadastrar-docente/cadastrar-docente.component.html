<div class="card card-custom">
  <div class="card-header bg-navy-custom text-black">
    <h5 class="mb-0">
      {{ modoEdicao ? 'Editar Docente' : 'Cadastrar Docente' }}
    </h5>
  </div>
  <form [formGroup]="docenteForm" (ngSubmit)="onSubmit()" class="form">
    <div class="card-body">

      <div class="row">
        <div class="col-md-6">
          <lib-form-input-padrao
            label="Nome Completo *"
            [control]="controlesFormulario['nome']"
            placeholder="Digite o nome completo"
            supportText="">
          </lib-form-input-padrao>
        </div>
        <div class="col-md-6">
          <lib-form-input-padrao
            label="Matrícula *"
            [control]="controlesFormulario['matricula']"
            placeholder="Digite a matrícula"
            supportText="">
          </lib-form-input-padrao>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-4">
          <lib-select-input-default
            label="Tipo Vaga"
            formControlName="tipoVaga"
            placeholder="Selecione..."
            [required]="true"
            [opcoes]="opcoesTipoVaga">
          </lib-select-input-default>
        </div>

        <div class="col-md-4">
          <lib-select-input-default
            label="Formação"
            formControlName="tipoFormacao"
            placeholder="Selecione..."
            [required]="true"
            [opcoes]="opcoesTipoFormacao">
          </lib-select-input-default>
        </div>

        <div class="col-md-4">
          <lib-select-input-default
            label="Origem Vaga"
            formControlName="origemVaga"
            placeholder="Selecione..."
            [required]="true"
            [opcoes]="opcoesOrigemVaga">
          </lib-select-input-default>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <lib-select-input-default
            label="Departamento"
            formControlName="departamentoId"
            placeholder="Selecione um departamento"
            [required]="true"
            [opcoes]="opcoesDepartamentos">
          </lib-select-input-default>
        </div>
        <div class="col-md-6">
          <lib-select-input-default
            label="Possui Licenciatura?"
            formControlName="licenciatura"
            placeholder="Selecione..."
            [required]="true"
            [clearable]="false"
            [searchable]="false"
            [opcoes]="opcoesLicenciatura">
          </lib-select-input-default>
        </div>
      </div>

    </div>
    <div class="card-footer d-flex justify-content-end">
      <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">
        <i class="la la-times"></i>
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="docenteForm.invalid">
        <i class="la la-check"></i> {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
      </button>
    </div>
  </form>
</div>
