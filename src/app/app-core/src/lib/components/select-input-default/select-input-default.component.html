<div class="form-group mb-4">
  <label *ngIf="label" class="form-label text-gray-700 fs-7 fw-bold" [ngClass]="{'required': required}">
    {{ label }}
  </label>

  <ng-select
    [items]="opcoes"
    bindLabel="label"
    bindValue="id"
    [placeholder]="placeholder"
    [formControl]="control"
    [searchable]="searchable"
    [clearable]="clearable"
    [notFoundText]="notFoundText"
    [ngClass]="{'is-invalid': control.invalid && (control.dirty || control.touched)}"
    class="ng-select-outline">
  </ng-select>

  <div *ngIf="control.invalid && (control.dirty || control.touched)" class="invalid-feedback d-block mt-1">
    <span *ngIf="control.errors?.['required']">Este campo é de preenchimento obrigatório.</span>
  </div>
</div>
