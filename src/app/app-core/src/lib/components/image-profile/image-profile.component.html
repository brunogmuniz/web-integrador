<div class="sidebar-user-profile mt-4 mb-4 d-flex align-items-center justify-content-center circle">
  <div
    *ngIf="name; else loading"
    class="user-avatar mb-2"
    [ngStyle]="{ 'background-color': getAvatarColor(name) }"
  >
    {{ getInitial(name) }}
  </div>

  <ng-template #loading>
    <div class="user-avatar mb-2 bg-secondary d-flex align-items-center justify-content-center">
      <i class="la la-user"></i>
    </div>
  </ng-template>
</div>
