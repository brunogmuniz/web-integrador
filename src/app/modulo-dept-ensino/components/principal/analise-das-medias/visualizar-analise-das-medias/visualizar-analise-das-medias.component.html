<div class="analise-container">
  <div class="ofertas-toolbar">
    <div class="ofertas-toolbar__grupo">
      <span class="ofertas-toolbar__label">Ofertas selecionadas</span>
      <div class="ofertas-selecionadas">
        <span class="oferta-chip" *ngFor="let oferta of ofertasSelecionadas">
          <span>{{ formatarOferta(oferta) }}</span>
          <button
            type="button"
            class="btn-remover-oferta"
            title="Remover oferta"
            (click)="removerOferta(oferta)">
            <i class="fa fa-times"></i>
          </button>
        </span>
      </div>
    </div>

    <div class="adicionar-oferta">
      <div class="oferta-select-wrapper">
        <app-oferta-search-select
          label="Adicionar oferta"
          [ofertasExcluidas]="ofertasSelecionadasUuids"
          [limparToken]="limparOfertaAdicionarToken"
          (ofertaSelecionada)="selecionarOfertaAdicionar($event)">
        </app-oferta-search-select>
      </div>
      <button
        type="button"
        class="btn btn-primary btn-adicionar-oferta"
        title="Adicionar oferta"
        [disabled]="!ofertaSelecionadaUuid"
        (click)="adicionarOferta()">
        <i class="fa fa-plus"></i>
        Adicionar oferta
      </button>
    </div>
  </div>

  <ng-container *ngIf="loading$ | async; else conteudoPronto">
    <div class="spinner-overlay">
      <span>Processando análise...</span>
    </div>
  </ng-container>

  <ng-template #conteudoPronto>
    <ng-container *ngIf="error$ | async as errorMessage; else tabelaAnalise">
      <div class="card mt-3">
        <div class="card-body">
          <div class="text-center py-10">
            <div class="d-flex flex-column align-items-center">
              <i class="la la-info-circle fs-3x text-gray-400 mb-3"></i>
              <span class="text-gray-600 fw-semibold fs-5">
                {{ errorMessage }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #tabelaAnalise>
      <app-area-tabela
        *ngIf="data$ | async as dadosTabela"
        [dados]="dadosTabela">
      </app-area-tabela>
    </ng-template>
  </ng-template>
</div>
