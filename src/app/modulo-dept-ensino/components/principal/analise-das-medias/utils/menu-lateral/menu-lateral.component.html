<div class="kt-aside kt-aside--fixed kt-grid__item kt-grid kt-grid--desktop kt-grid--hor-desktop bg-navy-custom" id="kt_aside">

  <div class="kt-aside__brand kt-grid__item bg-navy-custom" id="kt_aside_brand">
    <div class="kt-aside__brand-logo">
      <a routerLink="/" style="color: white; font-weight: bold;">
        <img src="assets/img/brasao-ufsm-politecnico.png" style="width: 100%">
      </a>
    </div>
    <div class="kt-aside__brand-tools">
      <button class="kt-aside__brand-aside-toggler" id="kt_aside_toggler"><span></span></button>
    </div>
  </div>

  <div class="kt-aside-menu-wrapper kt-grid__item kt-grid__item--fluid bg-navy-custom" id="kt_aside_menu_wrapper">

    <div id="kt_aside_menu" class="kt-aside-menu bg-navy-custom" data-ktmenu-vertical="1" data-ktmenu-scroll="1">

      <div class="sidebar-user-profile text-center mt-4 mb-4">
        <div class="sidebar-user-profile text-center mt-4 mb-4">
          <div class="user-avatar mb-2 align-items-center">
            <lib-image-profile></lib-image-profile>
          </div>
        <div class="user-info">
          <h5 class="text-white font-weight-bold mb-0">
            {{ nome ? nome : 'Admin' }}
            <i class="fa fa-pencil-alt text-white-50" style="font-size: 0.8rem; cursor: pointer;"></i>
          </h5>
          <span class="d-block text-warning small font-weight-bold mt-1">
            {{ 'Departamento de Ensino' }}
          </span>
        </div>
      </div>
      <ul class="kt-menu__nav">

        <li class="kt-menu__section kt-menu__section--first">
          <h4 class="kt-menu__section-text text-white-50" style="opacity: 1; font-size: 1rem">PAGINAS</h4>
        </li>
        <li class="kt-menu__item" [routerLinkActive]="'kt-menu__item--active'">
          <a class="kt-menu__link" routerLink="/principal">
          <!--
            <img src="assets/icons/info_icon.png" style="height: 100%; margin: auto; padding-right: 5px">     -->
            <i class="la la-home" style="font-size: x-large; color: white; padding-right: 5px" ></i>
            <span class="kt-menu__link-text text-white">Home</span>
          </a>
        </li>

        <li class="kt-menu__section">
          <h4 class="kt-menu__section-text text-uppercase text-white font-weight-bold" style="opacity: 1; font-size: 1rem">
            PREVISÃO DE DEMANDA
          </h4>
        </li>

        <li class="kt-menu__item" [routerLinkActive]="'kt-menu__item--active'">
          <a class="kt-menu__link" routerLink="/media">
            <!-- <i class="kt-menu__link-icon flaticon-search text-white-50"></i>  -->
            <i class="la la-search-plus" style="font-size: x-large; color: white; padding-right: 5px" ></i>
            <span class="kt-menu__link-text text-white">Média das Áreas</span>
          </a>
        </li>


      </ul>
    </div>
  </div>
</div>
